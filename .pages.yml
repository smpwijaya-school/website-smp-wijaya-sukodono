media:
  input: public/images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

actions:
  - name: optimize-images
    label: "⚡ Kompres Foto Upload"
    workflow: optimize-images.yml
    confirm:
      title: "Jalankan Kompresi Foto?"
      message: "Sistem akan otomatis mengecilkan resolusi dan mengompres foto di public/images/uploads agar website tetap super cepat dan hemat kuota."
      button: "Mulai Kompresi"
content:
  - name: berita
    label: "Berita & Pengumuman"
    type: collection
    path: src/content/berita
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, kategori, tanggal, draft]
      default: { sort: tanggal, order: desc }
    fields:
      - { name: title, label: "Judul Berita", type: string, required: true }
      - { name: tanggal, label: "Tanggal Publikasi", type: date, required: true }
      - name: kategori
        label: "Kategori"
        type: select
        required: true
        options: { values: [Kegiatan, Prestasi, Pengumuman, Akademik] }
      - { name: thumbnail, label: "Foto Sampul (Landscape, maks 1 MB)", type: image }
      - { name: ringkasan, label: "Ringkasan Singkat (1-2 kalimat)", type: text, required: true }
      - { name: draft, label: "Simpan sebagai Draft", type: boolean, default: false }
      - { name: body, label: "Isi Berita", type: rich-text }

  - name: spmb
    label: "Pengaturan SPMB (Penerimaan Siswa Baru)"
    type: file
    path: src/content/data/spmb.json
    fields:
      - { name: aktif, label: "Status SPMB Dibuka? (Aktif/Tutup)", type: boolean, default: true }
      - { name: tahun_ajaran, label: "Tahun Ajaran (contoh: 2026/2027)", type: string, required: true }
      - name: banner
        label: "Notifikasi Banner TopBar (Muncul jika SPMB Dibuka)"
        type: object
        fields:
          - { name: label, label: "Label Badge Banner", type: string }
          - { name: teks, label: "Teks Pengumuman Banner", type: string }
      - name: popup
        label: "Pop-up Brosur SPMB (Menggunakan File Brosur SPMB jika Status Aktif)"
        type: object
        fields:
          - { name: cta_teks, label: "Teks Tombol CTA Pop-up (Default: Daftar SPMB Sekarang)", type: string }
          - { name: cta_link, label: "Tautan Tombol CTA Pop-up (Default: /spmb)", type: string }
      - name: hero
        label: "Bagian Header / Hero SPMB"
        type: object
        fields:
          - { name: judul, label: "Judul Halaman SPMB", type: string, required: true }
          - { name: deskripsi, label: "Deskripsi Singkat", type: text, required: true }
          - { name: foto, label: "Foto Latar Belakang Hero (16:9)", type: image }
      - name: pesan_tutup
        label: "Pesan Saat Pendaftaran Ditutup (Aktif = Mati)"
        type: object
        fields:
          - { name: judul, label: "Judul Pemberitahuan Penutupan", type: string }
          - { name: keterangan, label: "Isi Pesan / Instruksi ke Calon Siswa", type: text }
      - name: pendaftaran
        label: "Tautan Formulir & Kontak Layanan"
        type: object
        fields:
          - { name: link_formulir, label: "Tautan Google Forms / Portal Online", type: string }
          - { name: label_tombol, label: "Teks Tombol Formulir", type: string }
          - { name: brosur_pdf, label: "File Brosur / Poster SPMB (PDF / Gambar — tampil juga di Pop-up SPMB)", type: file }
          - { name: kontak_wa, label: "Nomor WhatsApp Panitia (contoh: 6281234567890)", type: string }
          - { name: pesan_wa, label: "Pesan WhatsApp Otomatis (Saat Tombol Diklik)", type: string }
      - name: jadwal
        label: "Jadwal Gelombang & Jam Layanan"
        type: object
        list: true
        fields:
          - { name: gelombang, label: "Nama Gelombang / Jam Layanan", type: string, required: true }
          - { name: waktu, label: "Rentang Tanggal / Waktu", type: string, required: true }
          - { name: badge, label: "Label Kategori (contoh: Inden, Reguler, Offline)", type: string }
      - name: alur
        label: "Alur Pendaftaran (Langkah 01 - 04)"
        type: object
        list: true
        fields:
          - { name: langkah, label: "Nomor Langkah (01, 02, dst)", type: string, required: true }
          - { name: judul, label: "Judul Langkah", type: string, required: true }
          - { name: deskripsi, label: "Penjelasan Langkah", type: text, required: true }
      - name: syarat_berkas
        label: "Persyaratan Berkas Pendaftaran"
        type: string
        list: true
      - name: beasiswa_kip
        label: "Informasi Beasiswa & KIP"
        type: object
        fields:
          - { name: judul, label: "Judul Informasi Beasiswa", type: string }
          - { name: keterangan, label: "Penjelasan Keringanan Biaya & Afirmasi", type: text }
      - name: faq
        label: "FAQ (Pertanyaan yang Sering Diajukan)"
        type: object
        list: true
        fields:
          - { name: pertanyaan, label: "Pertanyaan", type: string, required: true }
          - { name: jawaban, label: "Jawaban Lengkap", type: text, required: true }

  - name: pengaturan
    label: "Pengaturan Sekolah & Beranda"
    type: file
    path: src/content/data/pengaturan.json
    fields:
      - { name: nama_sekolah, label: "Nama Resmi Sekolah", type: string, required: true }
      - { name: npsn, label: "NPSN", type: string }
      - { name: akreditasi, label: "Akreditasi", type: string }
      - name: hero
        label: "Hero Utama / Banner Beranda"
        type: object
        fields:
          - { name: foto, label: "Foto Latar Belakang Hero (Upload format WebP/JPG, 16:9, maks 1 MB)", type: image }
          - { name: badge, label: "Teks Badge Hero (Opsional, contoh: Terakreditasi B • NPSN 20540036)", type: string }
          - { name: judul, label: "Judul Utama Hero (Awal)", type: string }
          - { name: judul_sorot, label: "Teks Sorotan Emas (Opsional, contoh: Berilmu, Berkarakter,)", type: string }
          - { name: judul_akhiran, label: "Teks Lanjutan Judul (Opsional, contoh: & Berprestasi)", type: string }
          - { name: deskripsi, label: "Deskripsi / Tagline Singkat Hero", type: text }
          - { name: tombol_utama_teks, label: "Teks Tombol Utama (Kosongkan untuk otomatis: Informasi SPMB + Tahun)", type: string }
          - { name: tombol_utama_link, label: "Tautan Tombol Utama (Default: /spmb)", type: string }
          - { name: tombol_sekunder_teks, label: "Teks Tombol Kedua (Default: Profil Sekolah)", type: string }
          - { name: tombol_sekunder_link, label: "Tautan Tombol Kedua (Default: /profil)", type: string }
      - name: sambutan_kepsek
        label: "Sambutan Kepala Sekolah"
        type: object
        fields:
          - { name: judul, label: "Judul / Subheading Sambutan", type: string }
          - { name: nama, label: "Nama Kepala Sekolah", type: string }
          - { name: foto, label: "Foto Kepala Sekolah", type: image }
          - { name: pesan, label: "Isi Sambutan Singkat", type: text }
      - name: kontak
        label: "Informasi Kontak Resmi"
        type: object
        fields:
          - { name: alamat, label: "Alamat Lengkap", type: text }
          - { name: telepon, label: "Telepon Sekolah", type: string }
          - { name: whatsapp, label: "Nomor WA TU (08xxx / 628xxx)", type: string }
          - { name: email, label: "Email Resmi Sekolah", type: string }
          - { name: instagram, label: "Link Instagram Sekolah", type: string }
          - { name: tiktok, label: "Link TikTok Sekolah", type: string }
          - { name: jam_layanan, label: "Jam Layanan Tata Usaha", type: string }
          - { name: maps_url, label: "Tautan / Embed Google Maps", type: string }
      - name: program_unggulan
        label: "Program Unggulan Sekolah (4 Pilar Beranda)"
        type: object
        list: true
        fields:
          - { name: nomor, label: "Nomor Urut (contoh: 01)", type: string, required: true }
          - { name: judul, label: "Nama Program Unggulan", type: string, required: true }
          - { name: deskripsi, label: "Penjelasan Singkat Program", type: text, required: true }
      - name: hero_pages
        label: "Foto Latar Hero Halaman Lain (Opsional)"
        type: object
        fields:
          - { name: profil, label: "Foto Hero Profil", type: image }
          - { name: fasilitas, label: "Foto Hero Fasilitas", type: image }
          - { name: ekskul, label: "Foto Hero Ekstrakurikuler", type: image }
          - { name: guru, label: "Foto Hero Guru & Staf", type: image }
          - { name: berita, label: "Foto Hero Berita", type: image }
          - { name: kontak, label: "Foto Hero Kontak", type: image }

  - name: fasilitas
    label: "Fasilitas Sekolah"
    type: file
    path: src/content/data/fasilitas.json
    fields:
      - name: daftar
        label: "Daftar Fasilitas"
        type: object
        list: true
        fields:
          - { name: id, label: "ID Unik", type: number, required: true }
          - { name: nama, label: "Nama Fasilitas", type: string, required: true }
          - name: kategori
            label: "Kategori"
            type: select
            options: { values: [Akademik, Laboratorium, Olahraga & Ibadah] }
          - { name: deskripsi, label: "Deskripsi Singkat", type: text }
          - { name: foto, label: "Foto Sampul Utama (4:3, maks 1 MB)", type: image }
          - name: galeri
            label: "Foto Tambahan / Galeri (Bisa lebih dari 1 foto)"
            type: image
            list: true

  - name: guru
    label: "Direktori Guru & Staf"
    type: file
    path: src/content/data/guru.json
    fields:
      - name: daftar
        label: "Daftar Tenaga Pendidik & Kependidikan"
        type: object
        list: true
        fields:
          - { name: nama, label: "Nama Lengkap & Gelar", type: string, required: true }
          - { name: jabatan, label: "Jabatan / Mata Pelajaran", type: string, required: true }
          - name: bidang
            label: "Kelompok"
            type: select
            options: { values: [Pimpinan, Guru Mapel, Staf TU] }
          - { name: inisial, label: "Inisial Avatar (2 Huruf)", type: string }
          - { name: foto, label: "Foto Profil", type: image }

  - name: profil
    label: "Halaman Profil Sekolah"
    type: file
    path: src/content/data/profil.md
    fields:
      - { name: title, label: "Judul Halaman", type: string }
      - { name: deskripsi, label: "Deskripsi Singkat Hero", type: text }
      - { name: hero_foto, label: "Foto Latar Hero Khusus (Opsional — kosongkan untuk ikut Pengaturan)", type: image }
      - { name: sejarah_judul, label: "Subjudul Sejarah Sekolah", type: string }
      - { name: visi, label: "Visi Sekolah", type: text }
      - { name: misi, label: "Daftar Misi", type: string, list: true }
      - name: filosofi_logo
        label: "Makna Unsur Lambang / Filosofi Logo"
        type: object
        list: true
        fields:
          - { name: judul, label: "Nama Unsur (contoh: 1. Perisai Segi Lima...)", type: string, required: true }
          - { name: penjelasan, label: "Makna / Filosofi Unsur", type: text, required: true }
      - { name: body, label: "Sejarah & Profil Lengkap", type: rich-text }

  - name: ekstrakurikuler
    label: "Ekstrakurikuler"
    type: file
    path: src/content/data/ekstrakurikuler.json
    fields:
      - name: daftar
        label: "Daftar Ekstrakurikuler"
        type: object
        list: true
        fields:
          - { name: id, label: "ID Unik", type: number, required: true }
          - { name: nama, label: "Nama Ekstrakurikuler", type: string, required: true }
          - name: kategori
            label: "Kategori Bidang"
            type: select
            options: { values: ["Olahraga", "Seni & Budaya", "Kepemimpinan", "Keagamaan", "Minat & Bakat"] }
          - { name: deskripsi, label: "Deskripsi Kegiatan", type: text, required: true }
          - { name: prestasi, label: "Prestasi / Catatan Unggulan", type: string }
          - { name: jadwal, label: "Hari & Jam Latihan", type: string }
          - { name: lokasi, label: "Tempat Latihan", type: string }
          - { name: pembina, label: "Pembina / Pelatih", type: string }
          - { name: badge, label: "Label Khusus (contoh: Unggulan, Wajib Kelas VII)", type: string }
          - { name: foto, label: "Foto Sampul Kegiatan Utama (4:3 atau 16:9, maks 1 MB)", type: image }
          - name: galeri
            label: "Galeri Foto Kegiatan Tambahan (Bisa upload lebih dari 1 gambar)"
            type: image
            list: true
